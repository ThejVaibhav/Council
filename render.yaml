# Render blueprint: FastAPI backend, managed Postgres and the React site, wired to each other.
# The only value to fill in by hand is GEMINI_API_KEY.
services:
  - type: web
    name: council-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m scripts.migrate
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: council-web
          property: host
      - key: DATABASE_URL
        fromDatabase:
          name: council-db
          property: connectionString
  - type: web
    name: council-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: council-api
          property: host
databases:
  - name: council-db
    plan: free
