# Render blueprint, free plan: one web service (API + website on the same URL) and a Postgres database.
# Paste GROQ_API_KEY (primary) and GEMINI_API_KEY (automatic fallback), and optionally GOOGLE_CLIENT_ID for "Continue with Google".
# To use Supabase instead, set DATABASE_URL to its connection string and delete the databases block.
services:
  - type: web
    name: council
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: council-db
          property: connectionString
databases:
  - name: council-db
    plan: free
